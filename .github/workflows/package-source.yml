name: Package Wedding ZA Source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-source.yml"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build source ZIP
        run: |
          mkdir -p package/wedding-za
          rsync -a             --exclude=".git"             --exclude="package"             --exclude=".github/workflows/package-source.yml"             ./ package/wedding-za/
          cd package
          zip -r ../wedding-za.zip wedding-za

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wedding-za-full-source
          path: wedding-za.zip
          if-no-files-found: error
          retention-days: 1

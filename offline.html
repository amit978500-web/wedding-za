<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17120f">
  <title>Wedding Za · Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3efe8;color:#191411;font-family:Arial,sans-serif}
    main{width:min(620px,100%);padding:36px;border:1px solid #ddd5cc;border-radius:24px;background:#fffdf9;box-shadow:0 24px 70px rgba(25,20,17,.10)}
    small{color:#7b2942;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:14px 0;font-family:Georgia,serif;font-size:clamp(42px,10vw,72px);font-weight:400;line-height:.95}
    p{color:#716861;line-height:1.7}
    button{margin-top:14px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:#7b2942;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <small>WEDDING ZA</small>
    <h1>You’re offline.</h1>
    <p>Your CRM data is kept server-side, so reconnect before making changes. Public Wedding Za pages will return as soon as your connection is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
